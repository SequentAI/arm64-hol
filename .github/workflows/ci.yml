name: CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  holbuild:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-polyml

      - uses: ./.github/actions/setup-holbuild
        with:
          holbuild-ref: v0.15.12

      - name: Build and check HOL theories
        run: |
          holbuild buildhol
          holbuild -j"$(nproc)" build --skip-proof-steps arm64HolTheory
          holbuild check arm64CryptoTheory arm64IsaTheory arm64IsaCvTheory \
            arm64NativeCasesTheory arm64NativeTheory arm64L3Theory arm64CoverageTheory arm64HolTheory

      - name: Check fixture-independent A64 EL0 coverage
        run: |
          python3 tools/a64_coverage.py --check --accept-add
          PYTHONPATH=tools python3 -m unittest discover -s tools -p 'test_*.py'

  native:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Regenerate the hardware observations
        run: |
          rustup component add llvm-tools
          python3 tests/generate_native.py --check
